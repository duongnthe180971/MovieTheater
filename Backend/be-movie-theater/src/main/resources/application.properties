spring.application.name=be-movie-theater
spring.datasource.url=jdbc:mysql://localhost:3306/db_movie_theater?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in the console
spring.jpa.show-sql=true
# Format SQL statements for readability
spring.jpa.properties.hibernate.format_sql=true
# Choose MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

### config JWT
movietheater.jwt.base64-secret=${JWT_SECRET}
# Expiration : 5 min (seconds = 60 * 60)
movietheater.jwt.access-token-validity-in-seconds=300
# Refresh : 7 days ( second = 7 * 24 * 60 * 60)
movietheater.jwt.refresh-token-validity-in-seconds=604800

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

be-movie-theater.upload-file.base-uri=./Image/

# VNPay
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl= https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/v1/payment-callback
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

#email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true